title = "Mast3r SFM"
description = "MAST3R: Multi-view Attention for Strategy-free Tracking and 3D Reconstruction."
url = "https://github.com/naver/mast3r_sfm"

[environment]
python_version = "3.11"
cuda = "11.8"
PYTHONNOUSERSITE = "1"


[installation]
channels = ["pytorch", "nvidia", "conda-forge"]

dependencies = [
    "ffmpeg",
    # Compilatori necessari per ASMK e Cython
    "gxx_linux-64=11.*", 
    "make",
    "cmake",
    "gcc_linux-64=11.*",

    "eigen",
    "ceres-solver>=2.1.0",
    "glog",
    "gflags",
    "boost",
    "suitesparse",
    "flann",
    # "freeimage", # Spesso opzionale o inclusa, controlliamo se serve
    "metis",     # Dipendenza di SuiteSparse spesso necessaria
]

pip_dependencies = [
    "pycolmap",
    "cython",
]

build_commands = [
    "pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cu118",
    "pip install 'opencv-python<4.10.0' 'faiss-gpu-cu11' 'numpy<2.0.0'",


    # 1. Installa le dipendenze Python definite nel repository
    # Pixi eseguirà questo comando all'interno dell'ambiente attivato
    "pip install -r {{method_vendor_dir}}/mast3r/requirements.txt",

    # 2. (Opzionale) Se sai che ci sono altri file requirements in sottomoduli (es. dust3r), aggiungili qui:
    "pip install -r {{method_vendor_dir}}/mast3r/dust3r/requirements.txt",
    "pip install -r {{method_vendor_dir}}/mast3r/dust3r/requirements_optional.txt",

    "bash -c 'cd {{method_vendor_dir}}/asmk/cython && cythonize *.pyx'",
    "bash -c 'cd {{method_vendor_dir}}/asmk && python setup.py build_ext --inplace'",
    "pip install 'numpy<2.0.0'",

    "bash -c 'cd {{method_vendor_dir}}/glomap && mkdir -p build && cd build && cmake .. -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=Release && make -j$(nproc) && make install'",
]

post_install_commands = [
    # Eventuali comandi da eseguire dopo l'installazione
    "cp {{project_root}}/helper_scripts/mast3r_glomap_cli.py {{method_vendor_dir}}/mast3r/mast3r_glomap_cli.py"
]

# Clona il repository Mast3r (branch mast3r_sfm)
[[installation.git_repos]]
url = "https://github.com/naver/mast3r.git"
branch = "mast3r_sfm"
path = "mast3r"
recursive = true

[[installation.git_repos]]
url = "https://github.com/jenicek/asmk"
branch = "master" 
path = "asmk"
recursive = true

[[installation.git_repos]]
url = "https://github.com/colmap/glomap.git"
branch = "main" 
path = "glomap"
recursive = true

[validation]
validation_command = "python -c 'import sys; print(\"1. Paths\"); sys.path.insert(0, \"vendor/mast3r\"); sys.path.insert(0, \"vendor/asmk\"); print(\"2. NumPy\"); import numpy; print(f\"   NumPy {numpy.__version__}\"); print(\"3. Torch\"); import torch; print(f\"Torch {torch.__version__}\"); print(f\"   CUDA: {torch.cuda.is_available()}\"); print(\"4. Faiss\"); import faiss; print(\"   Faiss OK\"); print(\"5. ASMK\"); import asmk; print(\"   ASMK OK\"); print(\"6. Mast3r\"); import mast3r.model; print(\"   Mast3r OK\"); print(\"VALIDATION COMPLETE\")'"

[execution]
command = """
bash -c '
export PYTHONPATH=$PYTHONPATH:{{method_vendor_dir}}/mast3r:{{method_vendor_dir}}/asmk &&
python {{method_vendor_dir}}/mast3r/mast3r_glomap_cli.py \
--model_name MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric \
--input_files {{inputs.images_dir}} \
--output_dir {{outputs.model_dir}} \
--device cuda --shared_intrinsics \
--scenegraph_type swin --winsize 20 --win_cyclic && \
mkdir -p {{outputs.model_dir}}/images && \
cp -rn {{inputs.images_dir}}/* {{outputs.model_dir}}/images/
'
"""

[execution.outputs]
model_dir = "{{step_output_dir}}"