title = "COLMAP"
description = "General-purpose Structure-from-Motion (SfM) and Multi-View Stereo (MVS) pipeline."
url = "https://colmap.github.io/"
type = "sfm"

[environment]
python_version = "3.10"
cuda = "12.1"
PYTHONNOUSERSITE = "1"
torch_version = "2.1.2"
torchvision_version = "0.16.2"


[installation]
shared_env = false
channels = ["pytorch", "nvidia", "conda-forge"]

dependencies = [
    "colmap",
    "ffmpeg",
    "imagemagick",
]

pip_dependencies = [
    "pycolmap",
    "opencv-python",
    "tqdm",
    "numpy",
    "scipy",
    "pandas",
    "plyfile"
]


build_commands = [
]

[validation]
validation_command = "colmap help"

[execution]
command = """
bash -c '
set -e

unset QT_PLUGIN_PATH
unset QT_QPA_PLATFORM_PLUGIN_PATH
export QT_QPA_PLATFORM=offscreen
export OPENCV_LOG_LEVEL=ERROR

mkdir -p {{outputs.model_dir}}/input
mkdir -p {{outputs.model_dir}}/distorted/sparse

cp -r {{inputs.images_dir}}/. {{outputs.model_dir}}/input/

colmap feature_extractor \
    --database_path {{outputs.database_path}} \
    --image_path {{outputs.model_dir}}/input \
    --ImageReader.single_camera 1 \
    --SiftExtraction.use_gpu {{kwargs.get("use_gpu", 1)}}

colmap exhaustive_matcher \
    --database_path {{outputs.database_path}} \
    --SiftMatching.use_gpu {{kwargs.get("use_gpu", 1)}}

colmap mapper \
    --database_path {{outputs.database_path}} \
    --image_path {{outputs.model_dir}}/input \
    --output_path {{outputs.model_dir}}/distorted/sparse
'
"""

[execution.outputs]
model_dir = "{{step_output_dir}}"
database_path = "{{step_output_dir}}/distorted/database.db"

