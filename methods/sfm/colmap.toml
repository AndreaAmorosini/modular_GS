title = "COLMAP"
description = "General-purpose Structure-from-Motion (SfM) and Multi-View Stereo (MVS) pipeline."
url = "https://colmap.github.io/"

[environment]
python_version = "3.10"
cuda = "11.8"
PYTHONNOUSERSITE = "1"


[installation]
channels = ["pytorch", "nvidia", "conda-forge"]

dependencies = [
    "colmap",
    "ffmpeg",
    "imagemagick",
    "pytorch=2.1.2",
    "torchvision=0.16.2",
    "pytorch-cuda=11.8"
]

pip_dependencies = [
    "pycolmap",
    "opencv-python",
    "tqdm",
    "numpy",
    "scipy",
    "pandas",
    "plyfile"
]


build_commands = [
]

[validation]
validation_command = "colmap help"