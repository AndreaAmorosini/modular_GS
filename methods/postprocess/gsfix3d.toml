title = "GSFix3D"
description = "Diffusion-Guided Repair of Novel Views in Gaussian Splatting. Removes artifacts and fills holes for novel views in 3DGS scenes."
url = "https://github.com/GSFix3D/GSFix3D"
type = "post_processing"

[environment]
python_version = "3.11"
cuda = "12.1"
PYTHONNOUSERSITE = "1"
torch_version = "2.4.1"
torchvision_version = "0.19.1"

[installation]
shared_env = false
channels = ["pytorch", "nvidia", "conda-forge"]


dependencies = [
    "gxx_linux-64=11.*",
    "gcc_linux-64=11.*",
    "make",
    "cmake",
    "ninja",
]

pip_dependencies = [
    "xformers==0.0.28",
    "plyfile",
    # "numpy==1.26.4",
    "scipy==1.16.3",
    "open3d",
    "tqdm",
    # "opencv-python",
    "torchmetrics",
    "accelerate>=0.22.0",
    "diffusers>=0.25.0",
    "transformers>=4.32.1",
    "datasets",
    "omegaconf",
    "wandb",
    "tabulate",
    "tensorboard",
    "pycolmap",
]

build_commands = [
    # "pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu118",
    "pip install 'opencv-python<4.10.0' 'faiss-gpu-cu11' 'numpy<2.0.0'",
    "pip install --no-build-isolation {{method_vendor_dir}}/gsfix3d/diff-gaussian-rasterization",
]

post_install_commands = [
    "python -c \"f='{{method_vendor_dir}}/gsfix3d/src/util/metric.py'; t=open(f).read(); t=t.replace('.values[:] = 0',' = 0.0'); t=t.replace('columns=[\"total\", \"counts\", \"average\"], data=0', 'columns=[\\\"total\\\", \\\"counts\\\", \\\"average\\\"], data=0.0'); open(f,'w').write(t)\"",
]

[[installation.git_repos]]
url = "https://github.com/GSFix3D/GSFix3D.git"
branch = "main"
path = "gsfix3d"
recursive = true

[validation]
validation_command = """python -c "
import sys
sys.path.insert(0, 'vendor/gsfix3d')
print('1. Torch & CUDA')
import torch
print(f'   Torch: {torch.__version__}')
print(f'   CUDA Available: {torch.cuda.is_available()}')
print('2. Diffusion Pipeline')
from marigold import MarigoldGSFixerPipeline; print('   MarigoldGSFixerPipeline OK')
print('3. Gaussian Rasterizer')
import diff_gaussian_rasterization; print('   diff_gaussian_rasterization OK')
print('4. GS Modules')
from gs.gaussian_model import GaussianModel; print('   GaussianModel OK')
from gs.gaussian_renderer import render; print('   Renderer OK')
print('5. pycolmap')
import pycolmap; print('   pycolmap OK')
print('6. huggingface_hub')
from huggingface_hub import snapshot_download; print('   huggingface_hub OK')
print('VALIDATION COMPLETE')
"
"""

# Pipeline completa in un unico bash command, 4 fasi:
#
#   Fase 0: Prepara la struttura dati a partire dall'output COLMAP
#           del tuo step SfM + modello GS trainato.
#           - Legge cameras.bin/images.bin per ottenere intrinsics + pose
#           - Genera novel view poses (interpolazione tra training cameras)
#           - Renderizza le novel views dal modello GS trainato
#           - Crea la struttura che GSFix3D si aspetta#   Fase 1: (opzionale) Fine-tune GSFixer
#   Fase 2: Inference GSFixer (ripara le novel view 2D)
#   Fase 3: Lifting 3D (raffina il modello 3DGS con le view riparate)# Per saltare il fine-tune, passa skip_finetune = true
# e fornisci direttamente il checkpoint HuggingFace in inputs.checkpoint

[execution]
command = """
cd {{method_vendor_dir}}/gsfix3d &&

echo "===== [GSFix3D 0/4] Preparazione dati dal modello COLMAP + GS =====" &&
python -c "
import os, sys, json, yaml
import numpy as np
import torch
from glob import glob
from tqdm import tqdm
from PIL import Image
from shutil import copy2
from scipy.spatial.transform import Rotation, Slerp
from scipy.interpolate import CubicSpline

sys.path.insert(0, '.')
from gs.camera import Camera
from gs.gaussian_model import GaussianModel
from gs.gaussian_renderer import render
from gs.general_utils import searchForMaxIteration, focal2fov
import pycolmap

gs_model_path = '{{inputs.gs_model_path}}'
sfm_path      = '{{inputs.sfm_path}}'
work_dir      = '{{outputs.result_dir}}/workspace'
recon_type    = '{{kwargs.get(\"recon_method_type\", \"modular_gs\")}}'
num_novel     = int('{{kwargs.get(\"num_novel_views\", \"20\")}}')
skip_finetune = '{{kwargs.get(\"skip_finetune\", \"false\")}}' == 'True' or '{{kwargs.get(\"skip_finetune\", \"false\")}}' == 'true'

# Normalizza gs_model_path (potrebbe essere un file PLY)
original_gs_path = gs_model_path
if os.path.isfile(gs_model_path):
    p = os.path.dirname(gs_model_path)
    found = False
    while p and p != os.path.dirname(p):
        if os.path.isdir(os.path.join(p, 'point_cloud')):
            gs_model_path = p
            found = True
            break
        p = os.path.dirname(p)
    if not found:
        print('Struttura standard non trovata per il PLY. Creazione cartella temporanea.')
        import re
        match = re.search(r'(\\d+)', os.path.basename(gs_model_path))
        it = int(match.group(1)) if match else 30000
        proxy_dir = os.path.join(work_dir, 'proxy_gs_model')
        pc_dir = os.path.join(proxy_dir, 'point_cloud', 'iteration_%d' % it)
        os.makedirs(pc_dir, exist_ok=True)
        target_ply = os.path.join(pc_dir, 'point_cloud.ply')
        if not os.path.exists(target_ply):
            copy2(original_gs_path, target_ply)
        gs_model_path = proxy_dir
        print('GS model path temporaneo creato: ' + gs_model_path)
elif not os.path.isdir(os.path.join(gs_model_path, 'point_cloud')):
    p = gs_model_path
    while p and p != os.path.dirname(p):
        p = os.path.dirname(p)
        if os.path.isdir(os.path.join(p, 'point_cloud')):
            gs_model_path = p
            break

print('GS model path: ' + gs_model_path)
if not os.path.exists(os.path.join(gs_model_path, 'cfg_args')):
    with open(os.path.join(gs_model_path, 'cfg_args'), 'w') as f:
        f.write('Namespace()')

device = torch.device('cuda:0')
torch.cuda.set_device(device)

NL = chr(10)

def get_T_cw(img):
    cfw = img.cam_from_world
    if callable(cfw):
        cfw = cfw()
    if hasattr(cfw, 'matrix'):
        try:
            m = cfw.matrix()
            if callable(m):
                m = m()
            arr = np.array(m)
            if arr.ndim == 2 and arr.shape[0] >= 3:
                T = np.eye(4)
                T[:3, :] = arr[:3, :4]
                return T
        except Exception:
            pass
    if hasattr(cfw, 'rotation') and hasattr(cfw, 'translation'):
        try:
            rot = cfw.rotation
            t = cfw.translation
            if callable(rot):
                rot = rot()
            if callable(t):
                t = t()
            if hasattr(rot, 'matrix'):
                rm = rot.matrix()
                if callable(rm):
                    rm = rm()
                R_mat = np.array(rm)
            else:
                R_mat = np.array(rot)
            if R_mat.ndim == 1 and R_mat.shape[0] == 4:
                from scipy.spatial.transform import Rotation as R_scipy
                R_mat = R_scipy.from_quat([R_mat[1], R_mat[2], R_mat[3], R_mat[0]]).as_matrix()
            t_vec = np.array(t).flatten()
            T = np.eye(4)
            T[:3, :3] = R_mat[:3, :3]
            T[:3, 3] = t_vec[:3]
            return T
        except Exception:
            pass
    try:
        arr = np.array(cfw)
        if arr.ndim == 2:
            T = np.eye(4)
            T[:3, :] = arr[:3, :4]
            return T
    except Exception:
        pass
    if hasattr(img, 'rotmat') and hasattr(img, 'tvec'):
        try:
            rm = img.rotmat()
            tv = img.tvec
            if callable(rm): rm = rm()
            if callable(tv): tv = tv()
            T = np.eye(4)
            T[:3, :3] = np.array(rm)[:3, :3]
            T[:3, 3] = np.array(tv).flatten()[:3]
            return T
        except Exception:
            pass
    raise RuntimeError('Impossibile estrarre T_cw. '
        'dir(img): ' + str([a for a in dir(img) if not a.startswith('_')]))

# ══ 1. COLMAP sparse model ══
sparse_candidates = [
    os.path.join(sfm_path, 'colmap', 'sparse', '0'),
    os.path.join(sfm_path, 'colmap', 'sparse'),
    os.path.join(sfm_path, 'sparse', '0'),
    os.path.join(sfm_path, 'sparse'),
]
sparse_path = None
for cand in sparse_candidates:
    if os.path.isdir(cand) and (
        os.path.exists(os.path.join(cand, 'cameras.bin')) or
        os.path.exists(os.path.join(cand, 'cameras.txt'))
    ):
        sparse_path = cand
        break
if sparse_path is None:
    raise FileNotFoundError('Modello COLMAP sparse non trovato in ' + sfm_path)

print('Modello COLMAP trovato in: ' + sparse_path)
recon = pycolmap.Reconstruction(sparse_path)

cam = list(recon.cameras.values())[0]
params = cam.params
model_name = cam.model_name if hasattr(cam, 'model_name') else cam.model.name
print('Camera model: ' + str(model_name) + ', params: ' + str(params))

if model_name in ('SIMPLE_PINHOLE',):
    fx = fy = float(params[0]); cx = float(params[1]); cy = float(params[2])
elif model_name in ('PINHOLE',):
    fx = float(params[0]); fy = float(params[1]); cx = float(params[2]); cy = float(params[3])
elif model_name in ('SIMPLE_RADIAL', 'SIMPLE_RADIAL_FISHEYE'):
    fx = fy = float(params[0]); cx = float(params[1]); cy = float(params[2])
elif model_name in ('RADIAL', 'RADIAL_FISHEYE'):
    fx = fy = float(params[0]); cx = float(params[1]); cy = float(params[2])
elif model_name in ('OPENCV', 'OPENCV_FISHEYE', 'FULL_OPENCV'):
    fx = float(params[0]); fy = float(params[1]); cx = float(params[2]); cy = float(params[3])
else:
    fx = fy = float(params[0]); cx = float(cam.width) / 2.0; cy = float(cam.height) / 2.0

intrinsics = {'width': cam.width, 'height': cam.height, 'fx': fx, 'fy': fy, 'cx': cx, 'cy': cy}
print('Intrinsics: %dx%d, fx=%.1f, fy=%.1f' % (intrinsics['width'], intrinsics['height'], fx, fy))

train_poses_c2w = []
for img_id in sorted(recon.images.keys()):
    T_cw = get_T_cw(recon.images[img_id])
    train_poses_c2w.append(np.linalg.inv(T_cw))
train_poses_c2w = np.array(train_poses_c2w)
print('Training cameras: %d' % len(train_poses_c2w))

# ══ 2. Novel view poses ══
positions = train_poses_c2w[:, :3, 3]
rotations = Rotation.from_matrix(train_poses_c2w[:, :3, :3])
n_train = len(train_poses_c2w)
t_train = np.linspace(0, 1, n_train)
t_novel = np.linspace(0, 1, num_novel + 2)[1:-1]
cs_x = CubicSpline(t_train, positions[:, 0])
cs_y = CubicSpline(t_train, positions[:, 1])
cs_z = CubicSpline(t_train, positions[:, 2])
slerp = Slerp(t_train, rotations)

novel_poses = []
novel_views_json = []
for t in t_novel:
    pos = np.array([cs_x(t), cs_y(t), cs_z(t)])
    rot = slerp(t).as_matrix()
    T_wc = np.eye(4); T_wc[:3, :3] = rot; T_wc[:3, 3] = pos
    novel_poses.append(T_wc)
    novel_views_json.append({'extrinsic': np.linalg.inv(T_wc).tolist()})
print('Novel views generate: %d' % len(novel_poses))

# ══ 3. Crea struttura workspace ══
os.makedirs(work_dir, exist_ok=True)
with open(os.path.join(work_dir, 'gs_model_root.txt'), 'w') as f:
    f.write(gs_model_path)
with open(os.path.join(work_dir, 'novel_views.json'), 'w') as f:
    json.dump(novel_views_json, f, indent=2)

results_dir = os.path.join(work_dir, 'results')
os.makedirs(results_dir, exist_ok=True)
images_found = False
for cand in [os.path.join(sfm_path, 'images'), os.path.join(gs_model_path, 'images'), os.path.join(gs_model_path, 'input')]:
    if os.path.isdir(cand):
        src_files = sorted([f for f in glob(os.path.join(cand, '*')) if os.path.isfile(f)])
        for i, src in enumerate(src_files):
            copy2(src, os.path.join(results_dir, 'frame%06d%s' % (i, os.path.splitext(src)[1])))
        print('Copiate %d immagini training da %s' % (len(src_files), cand))
        images_found = True
        break

with open(os.path.join(work_dir, 'traj.txt'), 'w') as f:
    for T_wc in train_poses_c2w:
        row = ['%.8f' % T_wc[r, c] for r in range(3) for c in range(4)]
        f.write(' '.join(row) + NL)

cam_params_path = os.path.join(os.path.dirname(work_dir), 'cam_params.json')
with open(cam_params_path, 'w') as f:
    json.dump({'camera': {'w': intrinsics['width'], 'h': intrinsics['height'],
        'fx': intrinsics['fx'], 'fy': intrinsics['fy'],
        'cx': intrinsics['cx'], 'cy': intrinsics['cy']}}, f, indent=2)

# ══ 4. Renderizza novel views ══
loaded_iter = searchForMaxIteration(os.path.join(gs_model_path, 'point_cloud'))
print('Caricamento modello GS da iterazione %d' % loaded_iter)

ply_path = os.path.join(gs_model_path, 'point_cloud', 'iteration_%d' % loaded_iter, 'point_cloud.ply')

with open(ply_path, 'rb') as f:
    n_extra = 0
    while True:
        line = f.readline().decode('utf-8', errors='ignore').strip()
        if line == 'end_header':
            break
        if line.startswith('property') and 'f_rest_' in line:
            n_extra += 1
sh_degree = int(((n_extra + 3) / 3) ** 0.5) - 1
print('SH degree stimato: %d (n_extra: %d)' % (sh_degree, n_extra))
with open(os.path.join(work_dir, 'sh_degree.txt'), 'w') as f:
    f.write(str(sh_degree))

gaussians = GaussianModel(sh_degree)
gaussians.load_ply(ply_path)

fov_x = focal2fov(intrinsics['fx'], intrinsics['width'])
fov_y = focal2fov(intrinsics['fy'], intrinsics['height'])
background = torch.tensor([0, 0, 0], dtype=torch.float32, device=device)

class FakePipe:
    convert_SHs_python = False
    compute_cov3D_python = False
    debug = False
pipe = FakePipe()

render_dir = os.path.join(work_dir, 'rendered_novel_views', 'gs_image_' + recon_type)
mesh_render_dir = os.path.join(work_dir, 'rendered_novel_views', 'mesh_image')
os.makedirs(render_dir, exist_ok=True)
os.makedirs(mesh_render_dir, exist_ok=True)

print('Rendering %d novel views...' % len(novel_poses))
with torch.no_grad():
    for i, T_wc in enumerate(tqdm(novel_poses)):
        T_cw = np.linalg.inv(T_wc)
        gs_cam = Camera(R=T_cw[:3, :3], T=T_cw[:3, 3],
            FoVx=fov_x, FoVy=fov_y,
            width=intrinsics['width'], height=intrinsics['height'])
        rendered = render(gs_cam, gaussians, pipe, background)['render']
        img = (rendered.detach().cpu().numpy().transpose(1, 2, 0) * 255).astype(np.uint8)
        Image.fromarray(img).save(os.path.join(render_dir, '%05d.png' % i), format='PNG')
        Image.fromarray(img).save(os.path.join(mesh_render_dir, '%05d.png' % i), format='PNG')

# ══ 5. Prepara struttura per fine-tune (se richiesto) ══
if not skip_finetune:
    ft_dir = os.path.join(work_dir, 'finetune')
    ft_rgb_dir = os.path.join(ft_dir, 'rgb')
    ft_gs_dir = os.path.join(ft_dir, 'rendered_gs')
    ft_mesh_dir = os.path.join(ft_dir, 'rendered_mesh')
    os.makedirs(ft_rgb_dir, exist_ok=True)
    os.makedirs(ft_gs_dir, exist_ok=True)
    os.makedirs(ft_mesh_dir, exist_ok=True)

    ft_h, ft_w = 480, 640

    print('Preparazione dati fine-tune: rendering training views a %dx%d...' % (ft_w, ft_h))
    train_img_files = sorted([f for f in glob(os.path.join(results_dir, '*')) if os.path.isfile(f)])
    with torch.no_grad():
        for i, T_wc in enumerate(tqdm(train_poses_c2w)):
            T_cw = np.linalg.inv(T_wc)
            gs_cam = Camera(R=T_cw[:3, :3], T=T_cw[:3, 3],
                FoVx=fov_x, FoVy=fov_y,
                width=intrinsics['width'], height=intrinsics['height'])
            rendered = render(gs_cam, gaussians, pipe, background)['render']
            img = (rendered.detach().cpu().numpy().transpose(1, 2, 0) * 255).astype(np.uint8)
            img_pil = Image.fromarray(img).resize((ft_w, ft_h), Image.LANCZOS)
            # Salva in rendered_gs/ e duplica in rendered_mesh/ (non abbiamo mesh, usiamo GS come proxy)
            img_pil.save(os.path.join(ft_gs_dir, '%05d.png' % i), format='PNG')
            img_pil.save(os.path.join(ft_mesh_dir, '%05d.png' % i), format='PNG')
            if i < len(train_img_files):
                gt_pil = Image.open(train_img_files[i]).convert('RGB').resize((ft_w, ft_h), Image.LANCZOS)
                gt_pil.save(os.path.join(ft_rgb_dir, '%05d.png' % i), format='PNG')

    print('Fine-tune data: %d triple rgb/rendered_gs/rendered_mesh in %s' % (len(os.listdir(ft_rgb_dir)), ft_dir))

    # Genera config YAML custom per i nostri dati
    cfg_dir = os.path.join(work_dir, 'config')
    os.makedirs(cfg_dir, exist_ok=True)

    # Dataset split configs (train/val/vis puntano tutti a 'finetune')
    for split in ['train', 'val', 'vis']:
        mode_key = split if split != 'val' else 'val'
        split_cfg = {
            'dataset': {
                mode_key: {
                    'name': 'replica',
                    'disp_name': 'custom_' + split,
                    'dir': 'finetune',
                    'dual_input': True,
                    'resize_to_hw': [480, 640],
                }
            }
        }
        with open(os.path.join(cfg_dir, 'custom_%s.yaml' % split), 'w') as f:
            yaml.dump(split_cfg, f, default_flow_style=False)

    # Config principale che include i custom splits
    main_cfg = {
        'base_config': [
            'config/logging.yaml',
            'config/wandb.yaml',
            os.path.join(cfg_dir, 'custom_train.yaml'),
            os.path.join(cfg_dir, 'custom_val.yaml'),
            os.path.join(cfg_dir, 'custom_vis.yaml'),
            'config/model_gsfixer.yaml',
        ],
        'pipeline': {
            'name': 'MarigoldGSFixerPipeline',
            'kwargs': {
                'default_denoising_steps': 4,
                'default_processing_resolution': 768,
            },
        },
        'dataloader': {
            'num_workers': 2,
            'effective_batch_size': 32,
            'max_train_batch_size': 2,
            'seed': 2025,
        },
        'trainer': {
            'name': 'MarigoldGSFixerFinetune',
            'init_seed': 2025,
            'save_period': 400,
            'backup_period': 1000,
            'validation_period': 400,
            'visualization_period': 100,
        },
        'multi_res_noise': {
            'strength': 0.9,
            'annealed': True,
            'downscale_strategy': 'original',
        },
        'max_epoch': 10000,
        'max_iter': 800,
        'optimizer': {'name': 'Adam'},
        'loss': {'name': 'mse_loss', 'kwargs': {'reduction': 'mean'}},
        'lr': 3.0e-05,
        'lr_scheduler': {
            'name': 'IterExponential',
            'kwargs': {'total_iter': 25000, 'final_ratio': 0.01, 'warmup_steps': 100},
        },
        'validation': {
            'denoising_steps': 1,
            'ensemble_size': 1,
            'processing_res': 0,
            'match_input_res': False,
            'resample_method': 'bilinear',
            'main_val_metric': 'lpips',
            'main_val_metric_goal': 'minimize',
            'init_seed': 2025,
        },
        'eval': {
            'alignment': 'least_square',
            'align_max_res': None,
            'eval_metrics': ['mse', 'psnr', 'ssim', 'lpips'],
        },
    }
    custom_cfg_path = os.path.join(cfg_dir, 'finetune_custom.yaml')
    with open(custom_cfg_path, 'w') as f:
        yaml.dump(main_cfg, f, default_flow_style=False)
    print('Config custom generata: ' + custom_cfg_path)

print('Fase 0 completata.')
" &&

echo "===== [GSFix3D 0.5/4] Download checkpoint=====" &&
python -c "
from huggingface_hub import snapshot_download
import os

hf_repo = '{{kwargs.get(\"hf_checkpoint_repo\", \"goldoak1421/gsfixer-full\")}}'
local_dir = '{{outputs.result_dir}}/checkpoints'
repo_name = hf_repo.split('/')[-1]
model_dir = os.path.join(local_dir, repo_name)

if os.path.exists(os.path.join(model_dir, 'model_index.json')):
    print('Checkpoint gia presente in: ' + model_dir)
else:
    print('Downloading ' + hf_repo + ' in ' + model_dir + '...')
    snapshot_download(repo_id=hf_repo, local_dir=model_dir)
    print('Download completato: ' + model_dir)
" &&

HF_REPO="{{kwargs.get('hf_checkpoint_repo', 'goldoak1421/gsfixer-full')}}" &&
REPO_NAME=$(basename "$HF_REPO") &&
BASE_CKPT="{{outputs.result_dir}}/checkpoints/$REPO_NAME" &&

{% if not kwargs.get('skip_finetune', false) %}
echo "===== [GSFix3D 1/4] Fine-tuning GSFixer =====" &&
rm -rf {{outputs.result_dir}}/finetune/finetune_custom &&
python scripts/gsfixer/train.py \
    --config {{outputs.result_dir}}/workspace/config/finetune_custom.yaml \
    --output_dir {{outputs.result_dir}}/finetune \
    --base_data_dir {{outputs.result_dir}}/workspace \
    --base_ckpt_dir {{outputs.result_dir}}/checkpoints \
    --no_wandb &&
FINETUNE_CKPT=$(find {{outputs.result_dir}}/finetune -name "model_index.json" -printf '%h\n' | head -1) &&
if [ -z "$FINETUNE_CKPT" ]; then
    echo "ERROR: Fine-tune non ha prodotto un checkpoint valido (model_index.json non trovato)" &&
    exit 1
fi &&
echo "Checkpoint fine-tune trovato: $FINETUNE_CKPT" &&
{% else %}
INPUT_CKPT="{{inputs.checkpoint}}" &&
if [ -n "$INPUT_CKPT" ]; then
    FINETUNE_CKPT="$INPUT_CKPT" &&
    echo "Usando checkpoint fornito in input: $FINETUNE_CKPT"
else
    FINETUNE_CKPT="$BASE_CKPT" &&
    echo "Usando checkpoint scaricato da HuggingFace: $FINETUNE_CKPT"
fi &&
{% endif %}

echo "===== [GSFix3D 2/4] GSFixer Inference (2D repair) =====" &&
python scripts/gsfixer/inference.py \
    --checkpoint $FINETUNE_CKPT \
    --recon_method_type {{kwargs.get('recon_method_type', 'modular_gs')}} \
    --data_type replica \
    --data_path {{outputs.result_dir}}/workspace \
    --output_dir {{outputs.result_dir}}/inference \
    --dual_input \
    {% if kwargs.get('denoise_steps') %}--denoise_steps {{kwargs.denoise_steps}}{% endif %} \
    {% if kwargs.get('seed') %}--seed {{kwargs.seed}}{% endif %} \
    {% if kwargs.get('batch_size') %}--batch_size {{kwargs.batch_size}}{% endif %} &&

echo "===== [GSFix3D 3/4] Lifting to 3D (refine GS model) =====" &&
GS_MODEL_ROOT=$(cat "{{outputs.result_dir}}/workspace/gs_model_root.txt") &&
SH_DEGREE=$(cat "{{outputs.result_dir}}/workspace/sh_degree.txt") &&
cp scripts/gsfix3d/refine_gs.py scripts/gsfix3d/refine_gs_patched.py &&
sed -i "s/train_camera_poses, test_camera_poses, intrinsics = read_replica_cameras(args.data_path)/train_camera_poses, test_camera_poses, intrinsics = read_replica_cameras(args.data_path); train_camera_poses = list(train_camera_poses)/" scripts/gsfix3d/refine_gs_patched.py &&
sed -i "s/kf_img = Image.open(train_rgb_file_paths\\[kf_idx\\])/kf_img = Image.open(train_rgb_file_paths[kf_idx]).resize((intrinsics['width'], intrinsics['height']), Image.LANCZOS)/" scripts/gsfix3d/refine_gs_patched.py &&
python scripts/gsfix3d/refine_gs_patched.py \
    -m $GS_MODEL_ROOT \
    --sh_degree $SH_DEGREE \
    --data_type replica \
    --data_path {{outputs.result_dir}}/workspace \
    --fixed_image_path {{outputs.result_dir}}/inference/rgb \
    --novel_views {{outputs.result_dir}}/workspace/novel_views.json \
    --output_dir {{outputs.result_dir}}/refined \
    --iters {{kwargs.get('refine_iters', 20)}} \
    --kf_iters {{kwargs.get('refine_kf_iters', 50)}} &&
rm scripts/gsfix3d/refine_gs_patched.py &&

echo "===== [GSFix3D 4/4] Pipeline complete ====="
"""

[execution.inputs]
gs_model_path = ""
sfm_path = ""
data_path = ""
checkpoint = ""

[execution.help]
help_command = "cd {{method_vendor_dir}}/gsfix3d && python scripts/gsfixer/inference.py --help && echo '---' && python scripts/gsfix3d/refine_gs.py --help"
[execution.outputs]
result_dir = "{{step_output_dir}}"

