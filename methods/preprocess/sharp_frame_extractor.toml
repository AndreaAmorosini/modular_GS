name = "sharp_frame_extraction"
step_type = "processing"
description = "Estrae i frame da un video utilizzando sharp-frame-extractor."

[installation]
conda_env_name = "sharp_frame_extractor"
# Questo pacchetto verrà installato nell'ambiente conda principale 'splat_pipe'
# Non necessita di un ambiente dedicato.

conda_channels = [
    "conda-forge",
    "pytorch", 
    "nvidia", 
    "defaults"
]

conda_packages = [
    "python=3.10", # Stabile e compatibile
    "pip",
    "ffmpeg"
]
pip_packages = [
    "sharp-frames"
]

[execution]
# Il comando è semplice: prende un video in input e produce una directory di immagini.
command = """
sharp-frames "{{ inputs.video_path }}" \
    "{{ outputs.image_dir }}" \
    --selection-method best-n --num-frames "{{ config.frame_count | default(300) }}" --min-buffer 3
"""

[execution.inputs]
# Questo step si aspetta di trovare 'video_path' nel contesto iniziale.
video_path = "string"

[execution.outputs]
# Definisce l'output che verrà prodotto e salvato nel contesto.
image_dir = "{{ step_output_dir }}/images"
primary_output = "image_dir"

[validation]
# Un semplice controllo per vedere se il comando 'sfextract' è disponibile nel PATH.
validation_command = "sharp-frames --help"