title = "FastGS"
description = "Training 3D Gaussian Splatting in 100 Seconds."
url = "https://github.com/fastgs/FastGS"

[environment]
python_version = "3.10"
cuda = "11.8"
PYTHONNOUSERSITE = "1"

[installation]
channels = ["pytorch", "nvidia", "conda-forge"]

dependencies = [
    "gxx_linux-64=11.*",
    "gcc_linux-64=11.*",
    "make",
    "cmake",
    "ninja",
    "glm",
    "colmap",
    "plyfile",
    "websockets",
]

pip_dependencies = [
    "plyfile",
    "tqdm",
    "argparse",
    "setuptools",
    "wheel",
    "websockets"
]

build_commands = [
    "pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu118",
    "pip install 'opencv-python<4.10.0' 'faiss-gpu-cu11' 'numpy<2.0.0'",
    "pip install --no-build-isolation {{method_vendor_dir}}/fastgs/submodules/diff-gaussian-rasterization_fastgs",
    "pip install --no-build-isolation {{method_vendor_dir}}/fastgs/submodules/simple-knn",
    "pip install --no-build-isolation {{method_vendor_dir}}/fastgs/submodules/fused-ssim",
]


[[installation.git_repos]]
url = "https://github.com/fastgs/FastGS"
branch = "main"
path = "fastgs"
recursive = true

[validation]
validation_command = "python -c 'import sys; sys.path.append(\"vendor/fastgs\"); print(\"1. Torch & CUDA\"); import torch; print(f\"   Torch: {torch.__version__}\"); print(f\"   CUDA Available: {torch.cuda.is_available()}\"); print(\"2. Custom Extensions\"); import diff_gaussian_rasterization_fastgs; print(\"   diff_gaussian_rasterization OK\"); import simple_knn; print(\"   simple_knn OK\"); import fused_ssim; print(\" fused_ssim OK\"); print(\"3. Repo Modules\"); import scene; import gaussian_renderer; print(\"   Scene/Renderer OK\"); print(\"VALIDATION COMPLETE\")'"

[execution]
command = "python {{method_vendor_dir}}/fastgs/convert.py -s {{inputs.source_path}} --skip_matching && python {{method_vendor_dir}}/fastgs/train.py -s {{inputs.source_path}} --model_path {{outputs.trained_model_dir}} --iterations {{kwargs.iterations}} --data_device cpu"

[execution.inputs]
expected_input_images_folder = "input"
expected_colmap_folder = "distorted/sparse/0"
expected_db_folder = "distorted"


[execution.outputs]
trained_model_dir = "{{step_output_dir}}"
