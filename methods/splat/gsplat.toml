[execution]
command = """
python {{method_vendor_dir}}/gsplat/examples/simple_trainer.py {{kwargs.get('method', 'mcmc')}} \
    --data-dir {{inputs.source_path}} \
    --result-dir {{outputs.trained_model_dir}} \
    --data-factor {{kwargs.get('data_factor', 3)}} \
    --test-every {{kwargs.get('test_every', 1000000000)}} \
    --disable-viewer \
    --disable-video \
    --eval-steps {{kwargs.get('eval_steps', 7000)}} \
    --render-traj-path {{kwargs.get('render_traj_path', 'raw')}} \
    --camera-model {{kwargs.get('camera_model', 'pinhole')}} \
    --init-type {{kwargs.get('init_type', 'sfm')}} \
    --max-steps {{kwargs.get('iterations', 30000)}} \
    --sh-degree {{kwargs.get('sh_degree', 3)}} \
    --sh-degree-interval {{kwargs.get('sh_degree_interval', 1000)}} \
    --ssim-lambda {{kwargs.get('ssim_lambda', 0.20)}} \
    --packed \
    --sparse-grad \
    --antialiased \
    --init-opa {{kwargs.get('init_opa', 0.5)}} \
    --init-scale {{kwargs.get('init_scale', 0.35)}} \
    --opacity-reg {{kwargs.get('opacity_reg', 0.002)}} \
    --scale-reg {{kwargs.get('scale_reg', 0.004)}} \
    --means-lr {{kwargs.get('means_lr', 0.00012)}} \
    --scales-lr {{kwargs.get('scales_lr', 0.004)}} \
    --opacities-lr {{kwargs.get('opacities_lr', 0.035)}} \
    --quats-lr {{kwargs.get('quats_lr', 0.001)}} \
    --sh0-lr {{kwargs.get('sh0_lr', 0.0025)}} \
    --shN-lr {{kwargs.get('shN_lr', 0.00025)}} \
    --strategy.cap-max {{kwargs.get('cap_max', 1500000)}} \
    --strategy.refine-start-iter {{kwargs.get('refine_start_iter', 750)}} \
    --strategy.refine-stop-iter {{kwargs.get('refine_stop_iter', 22000)}} \
    --strategy.refine-every {{kwargs.get('refine_every', 150)}} \
    --strategy.noise-injection-stop-iter {{kwargs.get('noise_injection_stop_iter', 18000)}} \
    --strategy.min-opacity {{kwargs.get('min_opacity', 0.006)}} \
    --save-ply
"""


[execution.inputs]
expected_input_images_folder = "images"
expected_colmap_folder = "sparse/0"
expected_db_folder = "."

[execution.help]
help_command = "python {{method_vendor_dir}}/gsplat/examples/simple_trainer.py mcmc --help"

[execution.outputs]
trained_model_dir = "{{step_output_dir}}"

