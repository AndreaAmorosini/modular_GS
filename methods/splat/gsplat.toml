title = "GSplat"
description = "Implementazione CUDA ultra-veloce di Gaussian Splatting sviluppata da Nerfstudio."
url = "https://github.com/nerfstudio-project/gsplat"
type = "gaussian_splatting"


[environment]
python_version = "3.10"
cuda = "12.6"
PYTHONNOUSERSITE = "1"
UV_HTTP_TIMEOUT = "300"
torch_version = "2.7.1"
torchvision_version = "0.22.1"

[installation]
shared_env = true
channels = ["conda-forge", "nvidia", "pytorch"]

dependencies = [
]

pip_dependencies = [
    "numpy>=2.0,<3.0",
    "tqdm",
    "typing_extensions",
    "tyro",
    "imageio",
    "scikit-learn",
    "lpips",
    "matplotlib",
    "tensorboard",
    "jaxtyping"
]

build_commands = [
    "bash -c \"grep -v -E '^[[:space:]]*(torch|torchvision|nvidia-|triton)([=<>~[:space:]]|$)' {{method_vendor_dir}}/gsplat/examples/requirements.txt > /tmp/gsplat_requirements_no_torch.txt\"",
    "pip install --no-build-isolation -r /tmp/gsplat_requirements_no_torch.txt",
    "bash -c 'python - <<\"PY\"\nfrom pathlib import Path\nimport re\nroot = Path(\"{{method_vendor_dir}}/gsplat/gsplat/cuda/csrc\")\npat = re.compile(r\"::cuda::ceil_div<[^>]+>\\(([^,\\n]+),\\s*([^)]+)\\)\")\nfor p in root.rglob(\"*\"):\n    if p.suffix in {\".cu\", \".cuh\", \".cpp\", \".h\", \".hpp\"}:\n        s = p.read_text()\n        ns = s\n        ns = pat.sub(r\"((\\1 + \\2 - 1) / \\2)\", ns)\n        ns = ns.replace(\"cudaEventCreate(&events[device_id], cudaEventDisableTiming)\", \"cudaEventCreateWithFlags(&events[device_id], cudaEventDisableTiming)\")\n        ns = ns.replace(\"cudaEventCreate(&merge_event, cudaEventDisableTiming)\", \"cudaEventCreateWithFlags(&merge_event, cudaEventDisableTiming)\")\n        ns = ns.replace(\"cudaEventCreateWithFlags &events[device_id], cudaEventDisableTiming)\", \"cudaEventCreateWithFlags(&events[device_id], cudaEventDisableTiming)\")\n        ns = ns.replace(\"cudaEventCreateWithFlags &merge_event, cudaEventDisableTiming)\", \"cudaEventCreateWithFlags(&merge_event, cudaEventDisableTiming)\")\n        if ns != s:\n            print(f\"patched {p}\")\n            p.write_text(ns)\nPY'",
    "bash -c 'MAX_JOBS=1 TORCH_CUDA_ARCH_LIST=8.9 pip install --no-build-isolation --no-deps -e {{method_vendor_dir}}/gsplat'",
]

[[installation.git_repos]]
url = "https://github.com/nerfstudio-project/gsplat"
branch = "main"
path = "gsplat"
recursive = true

[validation]
validation_command = "python -c 'import gsplat; print(f\"GSplat version: {gsplat.__version__}\"); import torch; print(f\"CUDA Available: {torch.cuda.is_available()}\")'"

