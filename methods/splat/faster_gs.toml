title = "Faster-GS"
description = "Exemplary integration of Faster-GS into the original reference implementation of '3D Gaussian Splatting for Real-Time Radiance Field Rendering'"
url = "https://fhahlbohm.github.io/faster-gaussian-splatting/"
type = "gaussian_splatting"

[environment]
python_version = "3.10"
cuda = "12.1"
PYTHONNOUSERSITE = "1"
torch_version = "2.5.1"
torchvision_version = "0.20.1"

[installation]
shared_env = true
channels = ["pytorch", "nvidia", "conda-forge"]


dependencies = [
]

pip_dependencies = [
    "plyfile",
    "tqdm",
    "argparse",
    "joblib"
]

build_commands = [
    "pip install 'opencv-python<4.10.0' 'faiss-gpu-cu11' 'numpy<2.0.0'",
    "pip install --no-build-isolation {{method_vendor_dir}}/gaussian_splatting/submodules/diff-gaussian-rasterization",
    "pip install --no-build-isolation {{method_vendor_dir}}/gaussian_splatting/submodules/simple-knn",
    "pip install --no-build-isolation {{method_vendor_dir}}/gaussian_splatting/submodules/fused-ssim",
    "pip install git+https://github.com/nerficg-project/faster-gaussian-splatting/#subdirectory=FasterGSCudaBackend --no-build-isolation",
]

[[installation.git_repos]]
url = "https://github.com/fhahlbohm/gaussian-splatting"
branch = "main"
path = "faster_gs"
recursive = true

[validation]
validation_command = """
python -c 'import sys; \
sys.path.append(\"vendor/gaussian_splatting\"); \
print(\"1. Torch & CUDA\"); \
import torch; \
print(f\"   Torch: {torch.__version__}\"); \
print(f\"   CUDA Available: {torch.cuda.is_available()}\"); \
print(\"2. Custom Extensions\"); \
import diff_gaussian_rasterization; \
print(\"   diff_gaussian_rasterization OK\"); \
import simple_knn; \
print(\"   simple_knn OK\"); \
import fused_ssim; \
print(\"   fused_ssim OK\"); \
import FasterGSCudaBackend; \
print(\"   FasterGSCudaBackend OK\"); \
print(\"3. Repo Modules\"); \
import scene; \
import gaussian_renderer; \
print(\"   Scene/Renderer OK\"); \
print(\"VALIDATION COMPLETE\")'
"""

[execution]
command = """
python {{method_vendor_dir}}/faster_gs/convert.py \
    -s {{inputs.source_path}} \
    --skip_matching && \
python {{method_vendor_dir}}/faster_gs/train.py \
    -s {{inputs.source_path}} \
    --model_path {{outputs.trained_model_dir}} \
    --iterations {{kwargs.iterations}} \
    --data_device cpu
"""

[execution.inputs]
expected_input_images_folder = "input"
expected_colmap_folder = "distorted/sparse/0"
expected_db_folder = "distorted"


[execution.help]
help_command = """
python {{method_vendor_dir}}/faster_gs/train.py --help
"""

[execution.outputs]
trained_model_dir = "{{step_output_dir}}"

