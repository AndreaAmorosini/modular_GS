#     {% endif %}
# {% else %}
#     echo "Errore: 'config.mode' non specificato per nerfstudio-commands"
# {% endif %}


# Definiamo TUTTI gli input e output possibili
[execution.inputs]
video_path = "string"   # Per mode='frame_extraction'
image_dir = "string"    # Per mode='train_export'
colmap_dir = "string"   # Per mode='train_export' (opzionale)

[execution.outputs]
image_dir = "{{step_output_dir}}"            # Per mode='frame_extraction'
model_dir = "{{step_output_dir}}"            # Per mode='train_export'
final_ply = "{{step_output_dir}}/splat/splat.ply" # Prodotto da 'train_export'
# 'primary_output' dipende dalla modalità, lo gestiamo nella pipeline.toml

[validation]
validation_command = "python -c 'import nerfstudio; import tinycudann; import gsplat; print(\"Nerfstudio Env OK\")'"