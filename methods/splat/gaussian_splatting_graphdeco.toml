title = "Gaussian Splatting graphdeco"
description = "Original 3D Gaussian Splatting implementation for real-time radiance field rendering."
url = "https://github.com/graphdeco-inria/gaussian-splatting"

[environment]
python_version = "3.10"
cuda = "11.8"
# Isolamento per evitare conflitti con pacchetti globali
PYTHONNOUSERSITE = "1"

[installation]
channels = ["pytorch", "nvidia", "conda-forge"]

# Aggiunta URL per le wheel precompilate (come in nerfstudio.toml)
wheels_base_url = "https://huggingface.co/datasets/AterMors/gs_wheels/resolve/main"

dependencies = [
    # "pytorch=2.1.2",
    # "torchvision=0.16.2",
    # Compilatori di sistema (potrebbero servire ancora per dipendenze minori, meglio lasciarli)
    "gxx_linux-64",
    "gcc_linux-64",
    "make",
    "cmake"
]

pip_dependencies = [
    "plyfile",
    "tqdm",
    "argparse",
    # Usiamo le versioni precompilate invece di compilare localmente
    "@wheel:diff-gaussian-rasterization",
    "@wheel:simple_knn"
]

build_commands = [
    "pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cu118",
    "pip install 'opencv-python<4.10.0' 'faiss-gpu-cu11' 'numpy<2.0.0'",
]

[[installation.git_repos]]
url = "https://github.com/graphdeco-inria/gaussian-splatting"
branch = "main"
path = "gaussian_splatting"
recursive = true

[validation]
validation_command = "python -c 'import sys; sys.path.append(\"vendor/gaussian_splatting\"); print(\"1. Torch & CUDA\"); import torch; print(f\"   Torch: {torch.__version__}\"); print(f\"   CUDA Available: {torch.cuda.is_available()}\"); print(\"2. Custom Extensions\"); import diff_gaussian_rasterization; print(\"   diff_gaussian_rasterization OK\"); import simple_knn; print(\"   simple_knn OK\"); print(\"3. Repo Modules\"); import scene; import gaussian_renderer; print(\"   Scene/Renderer OK\"); print(\"VALIDATION COMPLETE\")'"

[execution]
command = "python {{method_vendor_dir}}/gaussian_splatting/convert.py -s {{inputs.source_path}} --skip_matching && python {{method_vendor_dir}}/gaussian_splatting/train.py -s {{inputs.source_path}} --model_path {{outputs.trained_model_dir}} --iterations {{kwargs.iterations}} --data_device cpu"
# command = "python {{method_vendor_dir}}/gaussian_splatting/train.py -s {{inputs.source_path}} --model_path {{outputs.trained_model_dir}} --iterations {{kwargs.iterations}} --data_device cpu"


[execution.outputs]
trained_model_dir = "{{step_output_dir}}"