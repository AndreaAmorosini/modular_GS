title = "Nerfstudio"

[environment]
python_version = "3.10"
cuda = "11.8"

[installation]
channels = ["pytorch", "nvidia", "conda-forge"]

wheels_base_url = "https://huggingface.co/datasets/AterMors/gs_wheels/resolve/main"

dependencies = [
    # PyTorch con CUDA
    "pytorch=2.1.2",
    "torchvision=0.16.2",
]

pip_dependencies = [
    "nerfstudio",
    "plyfile",
    "tqdm",
    "@wheel:diff-gaussian-rasterization",
    "@wheel:tinycudann",
]