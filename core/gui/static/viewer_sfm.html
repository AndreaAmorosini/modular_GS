<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModularGS — SfM Viewer</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    :root { --bg: #0f1117; --text: #e2e6f0; --text-dim: #8b93a7; --accent: #5b8cff; --border: #2a3145; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      background: rgba(15,17,23,0.85); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; max-width: 420px; backdrop-filter: blur(6px);
    }
    #hud h1 { font-size: 14px; margin-bottom: 6px; }
    #hud .muted { color: var(--text-dim); font-size: 12px; }
    #progress { margin-top: 8px; height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; }
    #progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.15s; }
    #error { display: none; margin-top: 8px; color: #e5534b; font-size: 13px; border: 1px solid #e5534b; border-radius: 6px; padding: 8px 10px; }
    .ctrl { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-dim); }
    .ctrl input[type="range"] { width: 140px; }
    .hint { position: fixed; bottom: 12px; left: 14px; color: var(--text-dim); font-size: 11px; z-index: 10; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <h1 id="title">Loading…</h1>
    <div class="muted" id="meta"></div>
    <div class="ctrl">
      <label for="ptsize">Point size</label>
      <input type="range" id="ptsize" min="0.5" max="10" step="0.5" value="2">
    </div>
    <div id="progress"><div></div></div>
    <div id="error"></div>
  </div>
  <div class="hint">drag: orbit &nbsp;·&nbsp; scroll: zoom &nbsp;·&nbsp; right-drag: pan</div>
  <script type="module" src="/viewer_sfm.js"></script>
</body>
</html>
