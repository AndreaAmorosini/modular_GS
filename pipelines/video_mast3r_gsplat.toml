[steps.kwargs]
method = "mcmc"

data_factor = 1
test_every = 1000000000
eval_steps = 7000
render_traj_path = "raw"
camera_model = "pinhole"
init_type = "sfm"

iterations = 40000
sh_degree = 3
sh_degree_interval = 1000
ssim_lambda = 0.15

init_opa = 0.2
init_scale = 0.15

opacity_reg = 0.004
scale_reg = 0.008

means_lr = 0.00012
scales_lr = 0.003
opacities_lr = 0.03
quats_lr = 0.001
sh0_lr = 0.0025
shN_lr = 0.00025

cap_max = 1200000
refine_start_iter = 750
refine_stop_iter = 22000
refine_every = 150
noise_injection_stop_iter = 12000
min_opacity = 0.01

