# Sezione principale della pipeline con metadati e ordine degli step
[pipeline]
name = "Images to Splat Pipeline (COLMAP + GraphDeCo)"
description = "Pipeline completa da immagini a Gaussian Splat, usando COLMAP e l'implementazione originale di Graph-INRIA."
# Array di stringhe che definisce l'ordine di esecuzione
steps = ["structure_from_motion", "gaussian_splatting_training"]

# Sezione che definisce i dettagli di ogni step.
# Il nome dopo [step.] deve corrispondere a una delle stringhe in pipeline.steps
[step.structure_from_motion]
method = "colmap"
config = {}
inputs = { image_dir = "{{ context.input_file }}" }
output_key = "colmap_model_dir"

[step.gaussian_splatting_training]
method = "splat_graphdeco"
config = { iterations = 30000 }
inputs = { colmap_model_dir = "{{ context.colmap_model_dir }}" }
output_key = "final_ply"