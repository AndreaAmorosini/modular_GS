title = "Video to FastGS (Sharp Frames + COLMAP)"
description = "Estrae frame nitidi da video, calcola SfM con COLMAP e allena FastGS."

[global_options]
filter_opacity_threshold = 0.15

[[steps]]
name = "Extraction"
method = "methods/preprocess/sharp_frames.toml"

[steps.inputs]
video = "{{context.input_file}}"

[steps.kwargs]
num_frames = 400


[[steps]]
name = "StructureFromMotion"
method = "methods/sfm/colmap.toml"

[steps.inputs]
images_dir = "{{context.Extraction_sharp_images}}"

[steps.kwargs]
use_gpu = 1


[[steps]]
name = "Training"
method = "methods/splat/fastgs.toml"

[steps.inputs]
source_path = "{{context.StructureFromMotion_model_dir}}"

[steps.kwargs]
iterations = 30000
densify_grad_threshold = 0.0002
grad_abs_thresh = 0.0012
grad_thresh = 0.0002
opacity_reset_interval = 3000
lambda_dsssim = 0.2
dense = 0.001
position_lr_final = 0.0000016
shfeature_lr = 0.005
feature_lr = 0.0025
loss_thresh = 0.1

