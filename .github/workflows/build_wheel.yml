name: Build Universal GS Wheels

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build_wheels:
    name: ${{ matrix.pkg }} (py${{ matrix.python }}-cu${{ matrix.cuda_clean }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- COMBINAZIONE STABILE (Nerfstudio / Inria Standard) ---
          - python: "3.10"
            pytorch: "2.1.2"
            cuda: "11.8.0"
            cuda_clean: "118"
            
          # --- COMBINAZIONE MODERNA (Gsplat v1.0+ / Newer GS methods) ---
          - python: "3.10"
            pytorch: "2.3.1"
            cuda: "12.1.1"
            cuda_clean: "121"
            
          # --- COMBINAZIONE PYTHON 3.11 (Performance) ---
          - python: "3.11"
            pytorch: "2.3.1"
            cuda: "12.1.1"
            cuda_clean: "121"

          # --- BLEEDING EDGE (PyTorch 2.4 / CUDA 12.4) ---
          - python: "3.10"
            pytorch: "2.4.0"
            cuda: "12.4.1"
            cuda_clean: "124"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ matrix.cuda }}
          method: "network"

      - name: Install Build Dependencies
        run: |
          pip install --upgrade pip setuptools wheel ninja
          pip install "numpy<2.0"
          pip install torch==${{ matrix.pytorch }} torchvision --index-url https://download.pytorch.org/whl/cu${{ matrix.cuda_clean }}

      # Crea directory output strutturata
      - name: Create Dist Dir
        run: mkdir -p dist_final/cu${{ matrix.cuda_clean }}

      # ==========================================
      # 1. Diff-Gaussian-Rasterization
      # ==========================================
      # - name: Build diff-gaussian-rasterization
      #   env:
      #     TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9"
      #   run: |
      #     git clone --recursive https://github.com/graphdeco-inria/diff-gaussian-rasterization
      #     cd diff-gaussian-rasterization
      #     pip wheel . --no-deps --no-build-isolation -w ../dist_temp
      #     cd ..
      #     # SPOSTA SENZA RINOMINARE (Mantiene nome standard accettato da Pixi/Pip)
      #     mv dist_temp/*.whl dist_final/cu${{ matrix.cuda_clean }}/
      #     rm -rf dist_temp

      - name: Build diff-gaussian-rasterization
        env:
          TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9"
        run: |
          # Clona gaussian-splatting con tutti i submodules
          git clone --recursive https://github.com/graphdeco-inria/gaussian-splatting gs_repo
          
          # Builda dal submodule (stesso commit referenziato da gaussian-splatting)
          cd gs_repo/submodules/diff-gaussian-rasterization
          pip wheel . --no-deps --no-build-isolation -w ../../../dist_temp
          cd ../../..
          
          mv dist_temp/*.whl dist_final/cu${{ matrix.cuda_clean }}/
          rm -rf dist_temp
      
      - name: Build fused-ssim
        env:
          TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9"
        run: |
          cd gs_repo/submodules/fused-ssim
          pip wheel . --no-deps --no-build-isolation -w ../../../dist_temp
          cd ../../..
          
          mv dist_temp/*.whl dist_final/cu${{ matrix.cuda_clean }}/
          rm -rf dist_temp
          
          # Pulizia del repo gaussian-splatting
          rm -rf gs_repo

      # ==========================================
      # 2. Simple-KNN
      # ==========================================
      - name: Build simple-knn
        env:
          TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9"
        run: |
          git clone --recursive https://github.com/camenduru/simple-knn
          cd simple-knn
          pip wheel . --no-deps --no-build-isolation -w ../dist_temp
          cd ..
          mv dist_temp/*.whl dist_final/cu${{ matrix.cuda_clean }}/
          rm -rf dist_temp

      # ==========================================
      # 3. Gsplat (Nerfstudio)
      # ==========================================
      - name: Build gsplat
        env:
          TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9"
        run: |
          git clone --recursive https://github.com/nerfstudio-project/gsplat
          cd gsplat
          pip wheel . --no-deps --no-build-isolation -w ../dist_temp
          cd ..
          mv dist_temp/*.whl dist_final/cu${{ matrix.cuda_clean }}/
          rm -rf dist_temp

      # ==========================================
      # 4. Tiny-CUDA-NN (Richiede molta RAM/Tempo)
      # ==========================================
      - name: Build tiny-cuda-nn
        env:
          TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9"
        run: |
          git clone --recursive https://github.com/NVlabs/tiny-cuda-nn
          cd tiny-cuda-nn/bindings/torch
          export TCNN_CUDA_ARCHITECTURES="75;80;86;89"
          if [[ "${{ matrix.cuda_clean }}" == "12"* ]]; then
             export TCNN_CUDA_ARCHITECTURES="75;80;86;89;90"
          fi
          
          pip wheel . --no-deps --no-build-isolation -w ../../../dist_temp
          cd ../../..
          mv dist_temp/*.whl dist_final/cu${{ matrix.cuda_clean }}/
          rm -rf dist_temp

      # Upload Artifacts mantenendo la struttura
      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-cu${{ matrix.cuda_clean }}-py${{ matrix.python }}
          path: dist_final/

  upload_to_huggingface:
      needs: build_wheels
      runs-on: ubuntu-latest
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      steps:
        - name: Download Artifacts
          uses: actions/download-artifact@v4
          with:
            path: dist
            merge-multiple: true

        - name: Setup Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.10"

        - name: Install Hugging Face CLI
          run: pip install huggingface_hub[cli]

        - name: Upload to Hugging Face
          env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
          run: |
            export HF_REPO_ID="AterMors/gs_wheels" 
            hf auth login --token $HF_TOKEN --add-to-git-credential
            
            echo "Caricamento strutturato wheels su $HF_REPO_ID..."
            # L'upload ricorsivo manterrà le cartelle cu118/, cu121/ create sopra
            hf upload $HF_REPO_ID dist/ . --repo-type dataset