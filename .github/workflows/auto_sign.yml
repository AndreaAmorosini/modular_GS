name: Auto-Sign TOML Configurations

on:
  push:
    paths:
      - '**/*.toml'
      - '.github/workflows/auto_sign.yml'
    branches:
      - main  # O il tuo branch principale
  workflow_dispatch: {}

jobs:
  sign-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessario per poter committare le nuove firme

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy plyfile ecdsa

      - name: Sign TOML files
        env:
          MODULAR_GS_PRIVATE_KEY: ${{ secrets.MODULAR_GS_SECRET_KEY }}
          PYTHONPATH: .
        run: |
          python -c "
          import os
          import logging
          from pathlib import Path
          from core.utils import SignatureVerifier
          
          # Configura logging base per vedere output nella console di GitHub
          logging.basicConfig(level=logging.INFO)

          # Verifica presenza chiave
          if not os.environ.get('MODULAR_GS_PRIVATE_KEY'):
              print('::error::Secret MODULAR_GS_PRIVATE_KEY not found in GitHub Secrets!')
              exit(1)
              
          verifier = SignatureVerifier()
          root_dir = Path('.')
          
          count = 0
          # Cerca tutti i TOML ricorsivamente
          for toml_file in root_dir.rglob('*.toml'):
              # Escludi cartelle di sistema o virtual env
              if '.git' in str(toml_file) or 'site-packages' in str(toml_file):
                  continue
                  
              print(f'Signing: {toml_file}')
              verifier.sign(toml_file)
              count += 1
              
          print(f'Successfully signed {count} files.')
          "

      - name: Commit signatures
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "SECURITY: Auto-update TOML signatures [skip ci]"
          file_pattern: "**/*.toml"
